openapi: 3.1.0
info:
  title: Website Uptime Monitoring Platform API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service available
  /monitors:
    get:
      summary: List monitor records
      responses:
        "200":
          description: Records returned
    post:
      summary: Create monitor record
      responses:
        "201":
          description: Record created
  /checks:
    get:
      summary: List checkresult records
      responses:
        "200":
          description: Records returned
    post:
      summary: Create checkresult record
      responses:
        "201":
          description: Record created
