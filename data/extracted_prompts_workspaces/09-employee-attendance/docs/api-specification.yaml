openapi: 3.1.0
info:
  title: Employee Attendance Management System API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service available
  /attendance:
    get:
      summary: List attendance records
      responses:
        "200":
          description: Records returned
    post:
      summary: Create attendance record
      responses:
        "201":
          description: Record created
  /leave-requests:
    get:
      summary: List leaverequest records
      responses:
        "200":
          description: Records returned
    post:
      summary: Create leaverequest record
      responses:
        "201":
          description: Record created
