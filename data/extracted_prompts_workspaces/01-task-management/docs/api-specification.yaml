openapi: 3.1.0
info:
  title: Task Management Platform API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service available
  /projects:
    get:
      summary: List project records
      responses:
        "200":
          description: Records returned
    post:
      summary: Create project record
      responses:
        "201":
          description: Record created
  /tasks:
    get:
      summary: List task records
      responses:
        "200":
          description: Records returned
    post:
      summary: Create task record
      responses:
        "201":
          description: Record created
