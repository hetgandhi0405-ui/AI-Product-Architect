openapi: 3.1.0
info:
  title: Smart Home Monitoring Dashboard API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service available
  /devices:
    get:
      summary: List device records
      responses:
        "200":
          description: Records returned
    post:
      summary: Create device record
      responses:
        "201":
          description: Record created
  /readings:
    get:
      summary: List reading records
      responses:
        "200":
          description: Records returned
    post:
      summary: Create reading record
      responses:
        "201":
          description: Record created
