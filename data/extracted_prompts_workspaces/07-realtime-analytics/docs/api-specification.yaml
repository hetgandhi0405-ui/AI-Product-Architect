openapi: 3.1.0
info:
  title: Real-Time Analytics Dashboard API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service available
  /events:
    get:
      summary: List event records
      responses:
        "200":
          description: Records returned
    post:
      summary: Create event record
      responses:
        "201":
          description: Record created
  /metrics:
    get:
      summary: List metric records
      responses:
        "200":
          description: Records returned
    post:
      summary: Create metric record
      responses:
        "201":
          description: Record created
